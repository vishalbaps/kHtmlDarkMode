name: k_html_dark_mode
description: >-
  Standalone dark mode for HTML shown in a web view. Pass any HTML and get back
  a document that themes itself, keeping text at WCAG AA and brand colours intact.
version: 1.0.1
homepage: https://github.com/vishalbaps/kHtmlDarkMode
repository: https://github.com/vishalbaps/kHtmlDarkMode.git
issue_tracker: https://github.com/vishalbaps/kHtmlDarkMode/issues

topics:
  - html
  - dark-mode
  - webview
  - accessibility
  - theme

# Pure Dart and dependency-free on purpose: the package must resolve in every
# host app whatever Flutter, web-view or state-management versions it pins.
environment:
  sdk: ^3.0.0

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
