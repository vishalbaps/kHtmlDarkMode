include: package:lints/recommended.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - tool/node/**

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - unawaited_futures
